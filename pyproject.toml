[project]
name = "paracellular-transport"
version = "0.1.0"
description = "Simulation of paracellular ion transport across kidney tubule tight junctions"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["paracellular_transport*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
